<script>
  const API_URL = "http://localhost:3000/connections";

  const tabela = document.getElementById("connections-table");
  const campoPesquisa = document.querySelector(".search");
  const filtroStatus = document.querySelector("select");

  let conexoes = [];

  async function carregarConexoes() {
    try {
      tabela.innerHTML = `
        <tr>
          <td colspan="7">Carregando conexões...</td>
        </tr>
      `;

      const resposta = await fetch(API_URL);

      if (!resposta.ok) {
        throw new Error("Erro ao acessar o JSON Server.");
      }

      conexoes = await resposta.json();

      renderizarConexoes();

    } catch (erro) {
      console.error("Erro:", erro);

      tabela.innerHTML = `
        <tr>
          <td colspan="7">
            Não foi possível carregar as conexões.
            Verifique se o JSON Server está rodando.
          </td>
        </tr>
      `;
    }
  }

  function renderizarConexoes() {
    const pesquisa = campoPesquisa.value.toLowerCase().trim();
    const statusSelecionado = filtroStatus.value;

    const conexoesFiltradas = conexoes.filter(conexao => {

      const correspondePesquisa =
        conexao.user.toLowerCase().includes(pesquisa) ||
        conexao.sourceIp.toLowerCase().includes(pesquisa) ||
        conexao.vpnIp.toLowerCase().includes(pesquisa);

      let correspondeStatus = true;

      if (statusSelecionado === "Ativo") {
        correspondeStatus = conexao.status === "active";
      }

      if (statusSelecionado === "Alerta") {
        correspondeStatus = conexao.status === "alert";
      }

      return correspondePesquisa && correspondeStatus;
    });

    if (conexoesFiltradas.length === 0) {
      tabela.innerHTML = `
        <tr>
          <td colspan="7">
            Nenhuma conexão encontrada.
          </td>
        </tr>
      `;

      return;
    }

    tabela.innerHTML = "";

    conexoesFiltradas.forEach(conexao => {

      const linha = document.createElement("tr");

      let statusClasse = "neutral";
      let statusTexto = "Offline";

      if (conexao.status === "active") {
        statusClasse = "success";
        statusTexto = "Ativo";
      }

      if (conexao.status === "alert") {
        statusClasse = "warning";
        statusTexto = "Alerta";
      }

      linha.innerHTML = `
        <td>${conexao.user}</td>
        <td>${conexao.sourceIp}</td>
        <td>${conexao.vpnIp}</td>
        <td>${conexao.protocol}</td>
        <td>${conexao.duration || "--"}</td>
        <td>${conexao.traffic}</td>
        <td>
          <span class="tag ${statusClasse}">
            ${statusTexto}
          </span>
        </td>
      `;

      tabela.appendChild(linha);
    });
  }

  campoPesquisa.addEventListener("input", renderizarConexoes);
  filtroStatus.addEventListener("change", renderizarConexoes);

  carregarConexoes();

  // Atualiza os dados automaticamente a cada 10 segundos
  setInterval(carregarConexoes, 10000);
</script>
