<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEM Access | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page" data-page="login">
  <main class="login-card">
    <div class="brand brand-center">
      <img class="brand-logo" src="assets/logo.png" alt="Logo GEM Access">
      <div>
        <h1>GEM Access</h1>
        <p>Visibilidade para suas conexões.</p>
      </div>
    </div>

    <form class="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="admin@gemaccess.local" required>

      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="••••••••" required>

      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <p class="demo-note">Protótipo acadêmico • Dados fictícios</p>
  </main>
</body>
</html>
