<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEM Access | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page" data-page="login">
  <main class="login-card">
    <div class="brand brand-center">
      <img class="brand-logo" src="assets/logo.png" alt="Logo GEM Access">
      <div>
        <h1>GEM Access</h1>
        <p>Visibilidade para suas conexões.</p>
      </div>
    </div>

    <form class="login-form">
      <label for="name" hidden>Nome</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="120" placeholder="Seu nome" hidden>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="Seu e-mail" required>

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" minlength="10" maxlength="128" required>

      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
      <button id="auth-mode-toggle" type="button" class="btn btn-secondary btn-full">Criar conta</button>
      <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
    </form>

  </main>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
